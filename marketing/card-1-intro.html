<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KSS Innovate - Brand Introduction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; font-family: 'Inter', sans-serif; }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(145deg, #0a1628 0%, #0d2137 40%, #0a1628 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    position: relative; overflow: hidden; padding: 80px;
  }
  .card::before {
    content: ''; position: absolute; top: -200px; right: -200px;
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,86,179,0.15) 0%, transparent 70%);
  }
  .card::after {
    content: ''; position: absolute; bottom: -150px; left: -150px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,86,179,0.1) 0%, transparent 70%);
  }
  .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #0056b3, #007bff, #0056b3); }
  .logo-area { display: flex; align-items: center; gap: 20px; margin-bottom: 50px; z-index: 1; }
  .logo-area img { width: 80px; height: 80px; border-radius: 16px; }
  .logo-area span { font-size: 36px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .tagline { font-size: 52px; font-weight: 900; color: #fff; text-align: center; line-height: 1.2; z-index: 1; margin-bottom: 30px; }
  .tagline span { color: #007bff; }
  .subtitle { font-size: 22px; color: #8899aa; text-align: center; line-height: 1.6; z-index: 1; max-width: 700px; margin-bottom: 50px; }
  .services { display: flex; gap: 20px; z-index: 1; flex-wrap: wrap; justify-content: center; }
  .service-pill {
    background: rgba(0,86,179,0.15); border: 1px solid rgba(0,123,255,0.3);
    color: #7ab8ff; padding: 14px 28px; border-radius: 50px;
    font-size: 17px; font-weight: 600;
  }
  .website { position: absolute; bottom: 50px; font-size: 18px; color: #4a6a8a; font-weight: 600; z-index: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar"></div>
  <div class="logo-area">
    <img src="../assets/logo.jpg" alt="KSS Innovate" />
    <span>KSS Innovate</span>
  </div>
  <div class="tagline">We Build <span>Digital Solutions</span><br>For Growing Businesses</div>
  <div class="subtitle">Professional websites & software solutions designed to help your business stand out and grow online.</div>
  <div class="services">
    <div class="service-pill">🌐 Web Development</div>
    <div class="service-pill">📱 Mobile Apps</div>
    <div class="service-pill">⚙️ Custom Software</div>
    <div class="service-pill">🔍 SEO & Marketing</div>
  </div>
  <div class="website">kss-innovate.netlify.app</div>
</div>
</body>
</html>
