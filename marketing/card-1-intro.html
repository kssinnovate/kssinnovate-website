<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KSS Innovate - Brand Introduction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; background: #f0f4f8; font-family: 'Inter', sans-serif; overflow: hidden; } @media (max-width: 1100px) { .card { transform: scale(calc(100vw / 1080)); transform-origin: top left; } }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(145deg, #ffffff, #e3f2fd, #ffffff);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    position: relative; overflow: hidden; padding: 80px;
  }
  .card::before {
    content: ''; position: absolute; top: -200px; right: -200px;
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,86,179,0.15) 0%, transparent 70%);
  }
  .card::after {
    content: ''; position: absolute; bottom: -150px; left: -150px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,86,179,0.1) 0%, transparent 70%);
  }
  .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1565c0, #42a5f5, #1565c0); }
  .logo-area { display: flex; align-items: center; gap: 20px; margin-bottom: 50px; z-index: 1; }
  .logo-area img { width: 160px; height: 160px; border-radius: 20px; }
  .logo-area span { font-size: 36px; font-weight: 800; color: #1565c0; letter-spacing: -0.5px; }
  .tagline { font-size: 52px; font-weight: 900; color: #1a1a2e; text-align: center; line-height: 1.2; z-index: 1; margin-bottom: 30px; }
  .tagline span { color: #1565c0; }
  .subtitle { font-size: 22px; color: #546e7a; text-align: center; line-height: 1.6; z-index: 1; max-width: 700px; margin-bottom: 50px; }
  .services { display: flex; gap: 20px; z-index: 1; flex-wrap: wrap; justify-content: center; }
  .service-pill {
    background: #e3f2fd; border: 1px solid #bbdefb;
    color: #1565c0; padding: 14px 28px; border-radius: 50px;
    font-size: 17px; font-weight: 600;
  }
  .website { position: absolute; bottom: 50px; font-size: 18px; color: #546e7a; font-weight: 600; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .website a { text-decoration: none; color: #546e7a; }
  .visit-btn { display: inline-flex; align-items: center; gap: 10px; background: #1565c0; color: #fff; padding: 14px 30px; border-radius: 50px; font-size: 17px; font-weight: 700; text-decoration: none; }
  .visit-btn svg { width: 20px; height: 20px; fill: #fff; }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar"></div>
  <div class="logo-area">
    <img src="../assets/logo.jpg" alt="KSS Innovate" />
    <span>KSS Innovate</span>
  </div>
  <div class="tagline">We Build <span>Digital Solutions</span><br>For Growing Businesses</div>
  <div class="subtitle">Professional websites & software solutions designed to help your business stand out and grow online.</div>
  <div class="services">
    <div class="service-pill">🌐 Web Development</div>
    <div class="service-pill">📱 Mobile Apps</div>
    <div class="service-pill">⚙️ Custom Software</div>
    <div class="service-pill">📊 Data Analytics & Dashboards</div>
  </div>
  <div class="website">
    <a href="https://www.kssinnovate.co.za" class="visit-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>Visit Our Website</a>
    <span>www.kssinnovate.co.za</span>
  </div>
</div>
</body>
</html>
