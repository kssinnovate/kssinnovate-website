<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KSS Innovate - Special Offer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; font-family: 'Inter', sans-serif; }
  .card { width: 1080px; height: 1080px; background: linear-gradient(145deg, #0a1628, #071a30, #0a1628); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; padding: 80px; text-align: center; }
  .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #00c853, #007bff, #00c853); }
  .card::before { content: ''; position: absolute; top: -150px; right: -150px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(0,200,83,0.08) 0%, transparent 70%); }
  .card::after { content: ''; position: absolute; bottom: -150px; left: -150px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(0,123,255,0.08) 0%, transparent 70%); }
  .logo-area { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; z-index: 1; }
  .logo-area img { width: 55px; height: 55px; border-radius: 12px; }
  .logo-area span { font-size: 26px; font-weight: 700; color: #fff; }
  .offer-badge { background: linear-gradient(135deg, #00c853, #009624); color: white; padding: 10px 30px; border-radius: 50px; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; z-index: 1; }
  .title { font-size: 56px; font-weight: 900; color: #fff; z-index: 1; margin-bottom: 20px; line-height: 1.2; }
  .title span { color: #00c853; }
  .subtitle { font-size: 24px; color: #7a94b0; z-index: 1; margin-bottom: 50px; line-height: 1.5; max-width: 700px; }
  .offer-box { z-index: 1; background: rgba(0,200,83,0.05); border: 2px solid rgba(0,200,83,0.2); border-radius: 20px; padding: 40px 60px; margin-bottom: 40px; }
  .offer-price { font-size: 64px; font-weight: 900; color: #00c853; margin-bottom: 8px; }
  .offer-desc { font-size: 20px; color: #8899aa; }
  .cta-text { font-size: 18px; color: #5a7a9a; z-index: 1; }
  .cta-text strong { color: #fff; }
</style>
</head>
<body>
<div class="card">
  <div class="top-bar"></div>
  <div class="logo-area">
    <img src="../assets/logo.jpg" alt="KSS Innovate" />
    <span>KSS Innovate</span>
  </div>
  <div class="offer-badge">Limited Time Offer</div>
  <div class="title">Get Your Business<br><span>Online Today</span></div>
  <div class="subtitle">Professional websites built for growing businesses in South Africa</div>
  <div class="offer-box">
    <div class="offer-price">From R3,500</div>
    <div class="offer-desc">Complete website with mobile design, SEO &amp; free support</div>
  </div>
  <div class="cta-text">DM us or visit <strong>kss-innovate.netlify.app</strong></div>
</div>
</body>
</html>
