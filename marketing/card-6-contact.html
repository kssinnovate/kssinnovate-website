<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f4f8; font-family: 'Inter', sans-serif; overflow: hidden; }
  .card { width: 1080px; height: 1080px; background: linear-gradient(145deg, #ffffff, #e3f2fd, #ffffff); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; padding: 80px; transform-origin: center center; }
  @media (max-width: 1100px) { body { align-items: flex-start; padding-top: 0; } .card { transform: scale(calc(100vw / 1080)); transform-origin: top left; } }
  .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1565c0, #42a5f5, #1565c0); }
  .logo-area { display: flex; align-items: center; gap: 20px; margin-bottom: 50px; z-index: 1; }
  .logo-area img { width: 110px; height: 110px; border-radius: 18px; }
  .logo-area span { font-size: 32px; font-weight: 800; color: #1565c0; }
  .title { font-size: 52px; font-weight: 900; color: #1a1a2e; text-align: center; z-index: 1; margin-bottom: 16px; }
  .title span { color: #1565c0; }
  .subtitle { font-size: 22px; color: #546e7a; text-align: center; z-index: 1; margin-bottom: 60px; max-width: 600px; line-height: 1.5; }
  .contact-items { z-index: 1; display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 650px; }
  .contact-item { display: flex; align-items: center; gap: 24px; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 16px; padding: 24px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .contact-icon { font-size: 32px; width: 60px; height: 60px; background: #e3f2fd; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .contact-label { font-size: 14px; color: #1565c0; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .contact-value { font-size: 20px; color: #1a1a2e; font-weight: 600; }
  .social-links { z-index: 1; display: flex; gap: 20px; margin-top: 40px; }
  .social-link { width: 56px; height: 56px; background: #e3f2fd; border: 1px solid #bbdefb; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: background 0.2s; flex-direction: column; }
  .social-link:hover { background: #bbdefb; }
  .social-link svg { width: 26px; height: 26px; }
  .social-handles { z-index: 1; display: flex; gap: 20px; margin-top: 10px; }
  .social-handle { font-size: 12px; color: #546e7a; font-weight: 500; text-align: center; width: 56px; word-break: break-all; }
  .social-label { z-index: 1; margin-top: 8px; font-size: 14px; color: #546e7a; font-weight: 500; text-align: center; }
  .bottom-cta { z-index: 1; margin-top: 30px; background: #1565c0; color: #ffffff; padding: 18px 50px; border-radius: 50px; font-size: 20px; font-weight: 700; text-decoration: none; display: inline-block; transition: background 0.2s; }
  .bottom-cta:hover { background: #0d47a1; }
</style>
